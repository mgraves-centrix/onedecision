<path d="M 614 596 H 625" fill="none" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrow-5eead4)" opacity="0.9"/>
<path d="M 811 596 H 822" fill="none" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrow-5eead4)" opacity="0.9"/>
<path d="M 1008 596 H 1019" fill="none" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrow-5eead4)" opacity="0.9"/>
