<!doctype html><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
  /* Read at the size of a phone's search result, so: few words, huge, high contrast. */
  :root { --bg:#10131a; --panel:#171b24; --line:#2a3140; --ink:#e6e9ef; --dim:#9aa4b6;
          --accent:#5eead4; --warn:#fbbf24; --good:#4ade80;
          --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"IBM Plex Sans",system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1500px; height:1000px; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); position:relative;
         overflow:hidden; padding:90px 96px; display:grid;
         grid-template-columns: 1fr 420px; gap:56px; align-items:center; }
  .glow { position:absolute; left:-15%; top:-35%; width:70%; height:90%; pointer-events:none;
          background:radial-gradient(closest-side, rgba(94,234,212,.16), transparent 70%); }
  .left { position:relative; }
  .brand { display:flex; align-items:center; gap:16px; margin-bottom:34px; }
  .badge { width:58px; height:58px; border-radius:14px; background:var(--accent); color:#062b26;
           font-weight:700; font-size:34px; display:grid; place-items:center;
           box-shadow:0 0 40px rgba(94,234,212,.35); }
  .word { font-size:46px; font-weight:700; letter-spacing:-.03em; }
  h1 { font-size:86px; line-height:1.02; font-weight:700; letter-spacing:-.035em; }
  h1 .g { color:var(--accent); display:block; }
  .tag { margin-top:30px; display:inline-block; font-family:var(--mono); font-weight:600;
         font-size:22px; letter-spacing:.12em; text-transform:uppercase; color:var(--bg);
         background:var(--warn); padding:9px 16px; border-radius:8px; }

  .proof { position:relative; background:var(--panel); border:2px solid var(--line);
           border-radius:18px; padding:30px 30px 26px; }
  .label { font-family:var(--mono); font-size:17px; letter-spacing:.14em; color:var(--dim);
           text-transform:uppercase; margin-bottom:14px; }
  .zero { font-size:230px; line-height:.9; font-weight:700; color:var(--good); letter-spacing:-.05em; }
  .zl { font-size:30px; font-weight:600; margin-top:8px; line-height:1.15; }
  .sub { font-size:20px; color:var(--dim); margin-top:14px; }
</style>
<div class="glow"></div>
<div class="left">
  <div class="brand"><div class="badge">1</div><div class="word">OneDecision</div></div>
  <h1>Teach it once.<span class="g">It handles the<br>next hundred<br>decisions.</span></h1>
  <span class="tag">Agents for Humans</span>
</div>
<div class="proof">
  <div class="label">Replay, 24 past cases</div>
  <div class="zero">0</div>
  <div class="zl">wrong automatic actions</div>
  <div class="sub">before a person switched it on</div>
</div>
